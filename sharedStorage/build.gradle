plugins { id 'org.jetbrains.kotlin.multiplatform' }

kotlin {
    jvmToolchain(17)
    jvm()
    [iosArm64(), iosSimulatorArm64(), iosX64()].each { target ->
        target.compilations.main.cinterops {
            sqlite { definitionFile.set(project.file('src/nativeInterop/cinterop/sqlite.def')) }
        }
    }
    sourceSets {
        commonMain.dependencies {
            api project(':sharedDomain')
            // Public nested-backup DOM entry points expose these types; keep the existing version.
            api 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
        }
        commonTest.dependencies {
            implementation kotlin('test')
            implementation project(':sharedHealth')
        }
        jvmTest.dependencies { implementation 'org.xerial:sqlite-jdbc:3.46.1.3' }
    }
}
