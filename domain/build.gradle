plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm'
}

dependencies { api project(':sharedDomain') }

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// Retained Java entry-point suites validate the shared Kotlin/JVM implementation.
tasks.register('domainTest') {
    dependsOn testClasses
    doLast {
        fileTree('src/test/java').matching { include '**/*TestSuite.java' }.files.sort().each { suite ->
            def relative = file('src/test/java').toPath().relativize(suite.toPath()).toString()
            javaexec {
                classpath = sourceSets.test.runtimeClasspath
                mainClass = relative.replace(File.separator, '.').replaceAll(/\.java$/, '')
                enableAssertions = true
            }
        }
    }
}

tasks.named('check') { dependsOn domainTest }
tasks.named('test') { dependsOn domainTest }

// Keep the existing command-line Java suites/audits usable while their dependencies migrate.
// This is a build-only classpath directory, never packaged into the application.
tasks.register('prepareOfflineTests', Sync) {
    dependsOn testClasses, configurations.testRuntimeClasspath
    into layout.buildDirectory.dir('offline-tests')
    from sourceSets.main.output
    from sourceSets.test.output
    from { configurations.testRuntimeClasspath.findAll { it.name.endsWith('.jar') }.collect { zipTree(it) } }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

kotlin { jvmToolchain(17) }
