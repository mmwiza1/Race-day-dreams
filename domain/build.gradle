plugins {
    id 'java-library'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// The same dependency-free test suite is usable without Android or Gradle.
tasks.register('domainTest') {
    dependsOn testClasses
    doLast {
        fileTree('src/test/java').matching { include '**/*TestSuite.java' }.files.sort().each { suite ->
            def relative = file('src/test/java').toPath().relativize(suite.toPath()).toString()
            javaexec {
                classpath = sourceSets.test.runtimeClasspath
                mainClass = relative.replace(File.separator, '.').replaceAll(/\.java$/, '')
                enableAssertions = true
            }
        }
    }
}

tasks.named('check') { dependsOn domainTest }
tasks.named('test') { dependsOn domainTest }
