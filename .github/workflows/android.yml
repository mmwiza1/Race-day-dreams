name: Android coaching test build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Draft PRs use the focused shared Android/iOS checks in multiplatform.yml. Ready PRs (every
    # new commit), merged main and version tags always run this complete unfiltered matrix.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [28, 35, 36]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Require current canonical screenshots on main and release tags
        # Ready same-repository PRs capture and commit canonical screenshots below; main must match.
        if: github.event_name != 'pull_request'
        run: test "$(python3 scripts/screenshot-source.py)" = "$(cat docs/screenshots/source.sha256)"
      - name: Offline-compatible domain tests
        run: |
          sh scripts/test-domain.sh
          python3 scripts/test-schema.py
          python3 scripts/test-release-notes.py
          python3 scripts/test-development-assets.py
          python3 scripts/test-showcase.py
          python3 scripts/test-android-gate.py
          cmp THIRD_PARTY.md app/src/main/assets/third_party.md
          python3 scripts/generate-berlin-geometry.py --check
          python3 scripts/generate-tokyo-geometry.py --check
          python3 scripts/generate-london-geometry.py --check
          python3 scripts/generate-new-york-geometry.py --check
          python3 scripts/generate-paris-geometry.py --check
          python3 scripts/generate-dream-context.py --check
          python3 scripts/generate-dream-basemaps.py --check
          python3 scripts/test-dream-map-source.py
          python3 scripts/verify-guidance-assets.py
          python3 scripts/verify-dream-artwork.py
          python3 scripts/test-dream-artwork.py
          python3 scripts/test-dream-screenshots.py
          java -cp domain/build/offline-tests scripts/ExerciseGuidanceAudit.java --report
      - name: Build, lint and compile instrumentation tests
        run: ./gradlew :domain:check :app:assembleDebug :app:lintDebug :app:assembleDebugAndroidTest
      - name: Resolved runtime dependency inventory
        run: ./gradlew :app:dependencies --configuration debugRuntimeClasspath
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android persistence and draft tests
        # Normal full matrix instrumentation takes9–11minutes. Bound a stalled emulator/test
        # so failure logs remain actionable rather than waiting for the six-hour job limit.
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          #37.2.13 fixes leaked GLES contexts/surfaces/framebuffers on process exit.
          # Pin the official stable patch rather than a moving latest binary.
          emulator-build: 16740729
          # Explicit supported CPU backend; the action's swiftshader_indirect default is
          # deprecated and the virtual SystemUI/Launcher have blocked focus with ANRs.
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim
          # API28 limits forced dimensions to twice the initial display size. A real
          # 1080px device profile permits the mandatory1400px expanded-window captures.
          profile: pixel_2
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          disable-animations: true
          # API 35 also proves a real in-place upgrade with throwaway test keys (data kept, other key
          # and downgrade refused); the verified gate APK is restored byte-for-byte afterwards.
          script: sh scripts/run-android-gate.sh && if [ "${{ matrix.api-level }}" = "35" ]; then sh scripts/verify-android-upgrade.sh; fi
      - name: Prepare named test APK
        run: |
          mkdir -p build/distributions
          cp app/build/outputs/apk/debug/app-debug.apk build/distributions/Race-Day-Dreams-0.15.3-test1-debug.apk
          stat --format='APK_BYTES=%s' app/build/outputs/apk/debug/app-debug.apk
      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Race-Day-Dreams-0.15.3-test1-debug-api-${{ matrix.api-level }}
          path: build/distributions/Race-Day-Dreams-0.15.3-test1-debug.apk
      - name: Upload actual-build screenshots
        uses: actions/upload-artifact@v4
        with:
          name: actual-build-screenshots-api-${{ matrix.api-level }}
          path: build/canonical-screenshots/*.png
          if-no-files-found: error
      - name: Explain device test failures
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for report in Path('app/build/outputs/androidTest-results/connected').rglob('TEST-*.xml'):
              for case in ET.parse(report).iter('testcase'):
                  for failure in case.findall('failure') + case.findall('error'):
                      print(case.get('classname'), case.get('name'))
                      print((failure.text or failure.get('message', ''))[:20000])
          PY
      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports-api-${{ matrix.api-level }}
          path: app/build/reports/androidTests/connected/
          if-no-files-found: ignore

  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Check pinned Kotlin and Java formatting
        run: |
          python3 scripts/test-format-code.py
          python3 scripts/format-code.py --check --patch-output build/formatting.patch
          python3 scripts/format-code.py --check
      - name: Upload actionable formatting patch
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: formatting-patch
          path: build/formatting.patch
          if-no-files-found: ignore
      - name: Reviewable repository formatting patch
        if: failure()
        run: |
          python3 - <<'PYFORMAT'
          from pathlib import Path
          import base64
          patch = Path('build/formatting.patch')
          if patch.is_file():
              print('FORMATTING_PATCH ' + base64.b64encode(patch.read_bytes()).decode())
          PYFORMAT

  guidance-completeness:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # test-domain.sh now builds the shared Kotlin classpath with Gradle, which configures the
      # Android plugin; use the same SDK and cached dependency setup as the build jobs.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Compile and verify Android-independent guidance
        run: sh scripts/test-domain.sh
      - name: Require every canonical exercise and routine illustration
        run: java -cp domain/build/offline-tests scripts/ExerciseGuidanceAudit.java

  canonical-screenshots:
    needs: [build, formatting]
    # Capture publication is confined to this same-repository feature branch, never main.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: actual-build-screenshots-api-35
          path: build/screenshots-api-35
      - name: Commit canonical captures when screenshot source changes
        env:
          VERIFIED_HEAD: ${{ github.event.pull_request.head.sha }}
          CAPTURE_BRANCH: ${{ github.head_ref }}
        run: |
          test "$(git rev-parse HEAD)" = "$VERIFIED_HEAD" || exit 0
          python3 scripts/verify-dream-screenshots.py build/screenshots-api-35
          digest=$(python3 scripts/screenshot-source.py)
          previous=$(cat docs/screenshots/source.sha256 2>/dev/null || true)
          if [ "$digest" = "$previous" ]; then exit 0; fi
          mkdir -p docs/screenshots
          cp build/screenshots-api-35/*.png docs/screenshots/
          echo "$digest" > docs/screenshots/source.sha256
          echo "$VERIFIED_HEAD" > docs/screenshots/source-commit.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots
          git commit -m 'Capture canonical API 35 screenshots from verified test build'
          git push origin "HEAD:$CAPTURE_BRANCH"
      - name: Reviewable synthetic screenshot bytes
        # Text-only repository connectors can reconstruct these real PNGs for review.
        # Only instrumentation fixture renders are logged; no user data is available.
        run: |
          python3 - <<'PYSCREEN'
          from pathlib import Path
          import base64, json
          for image in sorted(Path('docs/screenshots').glob('*.png')):
              print('SCREENSHOT_REVIEW ' + json.dumps({'path': str(image), 'base64': base64.b64encode(image.read_bytes()).decode()}))
          PYSCREEN

  bootstrap-verified-download-alias:
    needs: [build, guidance-completeness, formatting]
    # Same-repository owner branch only. Copies the already verified MAIN release, never PR APKs.
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/0.12.3-plain-language-github-showcase' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify published main artifact and bootstrap only its download aliases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/bootstrap-development-alias.py
      - uses: actions/upload-artifact@v4
        with:
          name: verified-main-alias-bootstrap
          path: build/alias-bootstrap/verification.json
          if-no-files-found: error

  apple:
    # main/tags: run the shared iOS simulator, UI and device jobs inside THIS run so publication can
    # require Android and iOS verification of the same commit. Pull requests run multiplatform.yml
    # directly instead.
    if: github.event_name == 'push'
    uses: ./.github/workflows/multiplatform.yml
    permissions:
      contents: read
      pull-requests: read

  publish-test-release:
    needs: [build, guidance-completeness, formatting, apple]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Require complete instructional coverage before publication
        run: |
          sh scripts/test-domain.sh
          java -cp domain/build/offline-tests scripts/ExerciseGuidanceAudit.java
          test "$(python3 scripts/screenshot-source.py)" = "$(cat docs/screenshots/source.sha256)"
          python3 scripts/verify-dream-screenshots.py docs/screenshots
      - uses: actions/download-artifact@v4
        with:
          name: Race-Day-Dreams-0.15.3-test1-debug-api-35
          path: build/verified-apk
      - uses: actions/download-artifact@v4
        with:
          name: experimental-ios-device-unsigned
          path: build/verified-ios/iphoneos-unsigned
      - uses: actions/download-artifact@v4
        with:
          name: ios-simulator-universal-unsigned
          path: build/verified-ios/ios-simulator
      - name: Sign the verified APK with the release key when configured
        id: sign
        # Secrets reach only this publish job, which runs on pushes to main and version tags, never on
        # pull requests. Without a committed fingerprint the verified test-signed APK is published
        # unchanged with no update manifest; if secrets exist, the real key is first checked on a
        # scratch copy and only its public fingerprint is reported (see docs/ANDROID_UPDATES.md).
        env:
          RDD_ANDROID_KEYSTORE_BASE64: ${{ secrets.RDD_ANDROID_KEYSTORE_BASE64 }}
          RDD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RDD_ANDROID_KEYSTORE_PASSWORD }}
          RDD_ANDROID_KEY_ALIAS: ${{ secrets.RDD_ANDROID_KEY_ALIAS }}
          RDD_ANDROID_KEY_PASSWORD: ${{ secrets.RDD_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          # The same pinned build-tools as the build jobs, never whatever newest version the runner has.
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0' > /dev/null
          export APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" --version
          mkdir -p build/distribution
          verified=(build/verified-apk/*.apk)
          test "${#verified[@]}" -eq 1
          mode=$(sh scripts/sign-distribution-apk.sh "${verified[0]}" build/distribution/app.apk | tail -n 1)
          case "$mode" in signed|test-signed) ;; *) echo "Unexpected signing result: $mode" >&2; exit 1 ;; esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Publish verified APK and maintained release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_REF: ${{ github.ref }}
          BUILD_TAG: ${{ github.ref_name }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SIGNING_MODE: ${{ steps.sign.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c "import re;print(re.search(r\"versionName\\s+'([^']+)'\",open('app/build.gradle').read()).group(1))")
          code=$(python3 -c "import re;print(re.search(r'versionCode\s+(\d+)',open('app/build.gradle').read()).group(1))")
          apk="Race-Day-Dreams-$version.apk"
          cp build/distribution/app.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          certificate=''
          signing_args=()
          if [ "$SIGNING_MODE" = signed ]; then
            certificate=$(tr -d '[:space:]' < config/android-signing-certificate.sha256 | tr 'A-F' 'a-f')
            signing_args=(--signing-certificate "$certificate")
          fi
          if [ "$BUILD_REF" = 'refs/heads/main' ]; then
            # An older successful workflow must not overwrite a newer main build.
            live=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
            if [ "$live" != "$BUILD_SHA" ]; then exit 0; fi
            python3 scripts/release-notes.py --commit "$BUILD_SHA" --run-url "$BUILD_URL" --development "${signing_args[@]}" --output build/release-notes.md
            alias='Race-Day-Dreams-latest-test.apk'
            python3 scripts/development-assets.py --prepare "$apk" --version "$version" --directory build/public-assets
            if [ "$SIGNING_MODE" = signed ]; then
              # The in-app update manifest; never announces a lower versionCode than the live one.
              mkdir -p build/live-manifest
              if gh release view development --json assets --jq '.assets[].name' 2>/dev/null | grep -qx Race-Day-Dreams-latest-update.json; then
                gh release download development --pattern Race-Day-Dreams-latest-update.json --dir build/live-manifest --clobber
              fi
              python3 scripts/development-assets.py --update-manifest "build/public-assets/$apk" --version "$version" \
                --version-code "$code" --commit "$BUILD_SHA" --pin config/android-signing-certificate.sha256 \
                --live-manifest build/live-manifest/Race-Day-Dreams-latest-update.json --directory build/public-assets
            fi
            # Unsigned iOS developer/test builds from the same run: each must carry this exact commit,
            # bundle version and build number before it can replace the rolling iOS downloads.
            for kind in ios-simulator iphoneos-unsigned ipa; do
              # The .ipa comes from the same verified unsigned iPhone build artifact.
              source_dir="build/verified-ios/$kind"
              if [ "$kind" = ipa ]; then source_dir=build/verified-ios/iphoneos-unsigned; fi
              python3 scripts/development-assets.py --prepare-ios "$source_dir" --kind "$kind" \
                --version "$version" --version-code "$code" --commit "$BUILD_SHA" --directory build/public-assets
            done
            python3 - "$version" "$code" "$BUILD_SHA" "$BUILD_URL" "$certificate" <<'PYINFO'
          import importlib.util, sys
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('assets', 'scripts/development-assets.py')
          assets = importlib.util.module_from_spec(spec); spec.loader.exec_module(assets)
          version, code, commit, run, certificate = sys.argv[1:]
          out = Path('build/public-assets')
          digests = {'android-apk': assets.digest(out / f'Race-Day-Dreams-{version}.apk')}
          for kind in assets.IOS_KINDS:
              digests[kind] = assets.digest(out / assets.ios_names(version, kind)[0])
          text = assets.build_info(version, code, commit, run, digests, certificate or None)
          (out / f'Race-Day-Dreams-{version}-build-info.txt').write_text(text)
          (out / assets.BUILD_INFO_ALIAS).write_text(text)
          PYINFO
            # Preserve the last verified version and any owner-managed release assets.
            # Both aliases and versioned files come from this same gated API35 APK.
            live=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
            if [ "$live" != "$BUILD_SHA" ]; then exit 0; fi
            if gh release view development >/dev/null 2>&1; then
              # Versioned files first; the stable latest-* aliases switch last, so an interrupted upload
              # leaves the previous verified latest-* downloads in place.
              find build/public-assets -maxdepth 1 -type f ! -name 'Race-Day-Dreams-latest-*' -print0 |
                xargs -0 gh release upload development --clobber
              find build/public-assets -maxdepth 1 -type f -name 'Race-Day-Dreams-latest-*' -print0 |
                xargs -0 gh release upload development --clobber
            else
              if ! gh api "repos/$GH_REPO/git/ref/tags/development" >/dev/null 2>&1; then
                gh api --method POST "repos/$GH_REPO/git/refs" -f ref='refs/tags/development' -f sha="$BUILD_SHA"
              fi
              gh release create development build/public-assets/* --verify-tag --title 'Latest Development Build' --notes-file build/release-notes.md --prerelease --latest=false
            fi
            gh release download development --pattern "$apk" --pattern "$apk.sha256" --pattern "$alias" --pattern "$alias.sha256" --dir build/published-check --clobber
            expected=$(sha256sum "$apk" | cut -d ' ' -f1)
            python3 scripts/development-assets.py --verify --version "$version" --directory build/published-check --expected-sha "$expected"
            for kind in ios-simulator iphoneos-unsigned ipa; do
              read -r versioned_ios latest_ios < <(python3 scripts/development-assets.py --ios-names --kind "$kind" \
                --version "$version" --directory build/published-check)
              gh release download development --pattern "$versioned_ios*" \
                --pattern "$latest_ios*" --dir build/published-check --clobber
              expected_ios=$(sha256sum "build/public-assets/$versioned_ios" | cut -d ' ' -f1)
              python3 scripts/development-assets.py --verify-ios --kind "$kind" --version "$version" \
                --directory build/published-check --expected-sha "$expected_ios"
            done
            gh release download development --pattern Race-Day-Dreams-latest-build-info.txt --dir build/published-check --clobber
            cmp build/public-assets/Race-Day-Dreams-latest-build-info.txt build/published-check/Race-Day-Dreams-latest-build-info.txt
            if [ "$SIGNING_MODE" = signed ]; then
              # The published manifest must describe exactly the published, release-signed APK.
              gh release download development --pattern Race-Day-Dreams-latest-update.json --dir build/published-check --clobber
              cmp build/public-assets/Race-Day-Dreams-latest-update.json build/published-check/Race-Day-Dreams-latest-update.json
              python3 -c "import importlib.util,sys; s=importlib.util.spec_from_file_location('a','scripts/development-assets.py'); a=importlib.util.module_from_spec(s); s.loader.exec_module(a); a.verify_update_manifest(open(sys.argv[1]).read(), sys.argv[2], sys.argv[3])" \
                build/published-check/Race-Day-Dreams-latest-update.json "build/published-check/$apk" "$certificate"
            fi
            live=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
            if [ "$live" != "$BUILD_SHA" ]; then exit 0; fi
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/development" -f sha="$BUILD_SHA" -F force=true
            gh release edit development --title 'Latest Development Build' --notes-file build/release-notes.md --prerelease --latest=false
          else
            python3 scripts/release-notes.py --commit "$BUILD_SHA" --run-url "$BUILD_URL" --tag "$BUILD_TAG" "${signing_args[@]}" --output build/release-notes.md
            # Permanent tags/releases are never overwritten, including accidental retries.
            if gh release view "$BUILD_TAG" >/dev/null 2>&1; then
              echo 'Version release already exists; refusing to overwrite it.' >&2
              exit 1
            fi
            gh release create "$BUILD_TAG" "$apk" "$apk.sha256" --verify-tag --title "Race Day Dreams $version" --notes-file build/release-notes.md --prerelease --latest=false
          fi
