name: Android coaching test build
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [28, 35, 36]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Offline-compatible domain tests
        run: |
          sh scripts/test-domain.sh
          python3 scripts/test-schema.py
      - name: Build, lint and compile instrumentation tests
        run: ./gradlew :domain:check :app:assembleDebug :app:lintDebug :app:assembleDebugAndroidTest
      - name: Resolved runtime dependency inventory
        run: ./gradlew :app:dependencies --configuration debugRuntimeClasspath
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android persistence and draft tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest
            mkdir -p build/canonical-screenshots
            adb pull /data/local/tmp/racedaydreams-screenshots/. build/canonical-screenshots/
      - name: Prepare named test APK
        run: |
          mkdir -p build/distributions
          cp app/build/outputs/apk/debug/app-debug.apk build/distributions/Race-Day-Dreams-0.3.0-test1-debug.apk
      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Race-Day-Dreams-0.3.0-test1-debug-api-${{ matrix.api-level }}
          path: build/distributions/Race-Day-Dreams-0.3.0-test1-debug.apk
      - name: Upload actual-build screenshots
        uses: actions/upload-artifact@v4
        with:
          name: actual-build-screenshots-api-${{ matrix.api-level }}
          path: build/canonical-screenshots/*.png
          if-no-files-found: error
      - name: Explain device test failures
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for report in Path('app/build/outputs/androidTest-results/connected').rglob('TEST-*.xml'):
              for case in ET.parse(report).iter('testcase'):
                  for failure in case.findall('failure') + case.findall('error'):
                      print(case.get('classname'), case.get('name'))
                      print((failure.text or failure.get('message', ''))[:20000])
          PY
      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports-api-${{ matrix.api-level }}
          path: app/build/reports/androidTests/connected/
          if-no-files-found: ignore

  canonical-screenshots:
    needs: build
    # This job can only update the explicitly requested test branch, never main.
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/production-coach-test-build' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/production-coach-test-build
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: actual-build-screenshots-api-35
          path: build/screenshots-api-35
      - name: Commit canonical captures when screenshot source changes
        env:
          VERIFIED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$VERIFIED_HEAD" || exit 0
          digest=$(python3 scripts/screenshot-source.py)
          previous=$(cat docs/screenshots/source.sha256 2>/dev/null || true)
          if [ "$digest" = "$previous" ]; then exit 0; fi
          mkdir -p docs/screenshots
          cp build/screenshots-api-35/*.png docs/screenshots/
          echo "$digest" > docs/screenshots/source.sha256
          echo "$VERIFIED_HEAD" > docs/screenshots/source-commit.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots
          git commit -m 'Capture canonical API 35 screenshots from verified test build'
          git push origin HEAD:codex/production-coach-test-build
