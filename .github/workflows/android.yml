name: Android coaching test build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [28, 35, 36]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Require current canonical screenshots on other branches
        if: github.head_ref != 'feature/0.8.1-design-guidance-reliability'
        run: test "$(python3 scripts/screenshot-source.py)" = "$(cat docs/screenshots/source.sha256)"
      - name: Offline-compatible domain tests
        run: |
          sh scripts/test-domain.sh
          python3 scripts/test-schema.py
          python3 scripts/test-release-notes.py
          python3 scripts/generate-berlin-geometry.py --check
          java -cp domain/build/offline-tests scripts/ExerciseGuidanceAudit.java --report
      - name: Build, lint and compile instrumentation tests
        run: ./gradlew :domain:check :app:assembleDebug :app:lintDebug :app:assembleDebugAndroidTest
      - name: Resolved runtime dependency inventory
        run: ./gradlew :app:dependencies --configuration debugRuntimeClasspath
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android persistence and draft tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb shell wm size 540x1200
            adb shell wm density 210
            ./gradlew :app:connectedDebugAndroidTest
            mkdir -p build/canonical-screenshots
            adb pull /data/local/tmp/racedaydreams-screenshots/. build/canonical-screenshots/
      - name: Prepare named test APK
        run: |
          mkdir -p build/distributions
          cp app/build/outputs/apk/debug/app-debug.apk build/distributions/Race-Day-Dreams-0.8.1-test1-debug.apk
          stat --format='APK_BYTES=%s' app/build/outputs/apk/debug/app-debug.apk
      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Race-Day-Dreams-0.8.1-test1-debug-api-${{ matrix.api-level }}
          path: build/distributions/Race-Day-Dreams-0.8.1-test1-debug.apk
      - name: Upload actual-build screenshots
        uses: actions/upload-artifact@v4
        with:
          name: actual-build-screenshots-api-${{ matrix.api-level }}
          path: build/canonical-screenshots/*.png
          if-no-files-found: error
      - name: Explain device test failures
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for report in Path('app/build/outputs/androidTest-results/connected').rglob('TEST-*.xml'):
              for case in ET.parse(report).iter('testcase'):
                  for failure in case.findall('failure') + case.findall('error'):
                      print(case.get('classname'), case.get('name'))
                      print((failure.text or failure.get('message', ''))[:20000])
          PY
      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports-api-${{ matrix.api-level }}
          path: app/build/reports/androidTests/connected/
          if-no-files-found: ignore

  guidance-completeness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and verify Android-independent guidance
        run: sh scripts/test-domain.sh
      - name: Require every canonical exercise and routine illustration
        run: java -cp domain/build/offline-tests scripts/ExerciseGuidanceAudit.java

  canonical-screenshots:
    needs: build
    # Capture publication is confined to this same-repository feature branch, never main.
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/0.8.1-design-guidance-reliability' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/0.8.1-design-guidance-reliability
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: actual-build-screenshots-api-35
          path: build/screenshots-api-35
      - name: Commit canonical captures when screenshot source changes
        env:
          VERIFIED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$VERIFIED_HEAD" || exit 0
          digest=$(python3 scripts/screenshot-source.py)
          previous=$(cat docs/screenshots/source.sha256 2>/dev/null || true)
          if [ "$digest" = "$previous" ]; then exit 0; fi
          mkdir -p docs/screenshots
          cp build/screenshots-api-35/*.png docs/screenshots/
          echo "$digest" > docs/screenshots/source.sha256
          echo "$VERIFIED_HEAD" > docs/screenshots/source-commit.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots
          git commit -m 'Capture canonical API 35 screenshots from verified test build'
          git push origin HEAD:feature/0.8.1-design-guidance-reliability
      - name: Reviewable synthetic screenshot bytes
        # Text-only repository connectors can reconstruct these real PNGs for review.
        # Only instrumentation fixture renders are logged; no user data is available.
        run: |
          python3 - <<'PYSCREEN'
          from pathlib import Path
          import base64, json
          for image in sorted(Path('docs/screenshots').glob('*.png')):
              print('SCREENSHOT_REVIEW ' + json.dumps({'path': str(image), 'base64': base64.b64encode(image.read_bytes()).decode()}))
          PYSCREEN

  publish-test-release:
    needs: [build, guidance-completeness]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Require complete instructional coverage before publication
        run: |
          sh scripts/test-domain.sh
          java -cp domain/build/offline-tests scripts/ExerciseGuidanceAudit.java
          test "$(python3 scripts/screenshot-source.py)" = "$(cat docs/screenshots/source.sha256)"
      - uses: actions/download-artifact@v4
        with:
          name: Race-Day-Dreams-0.8.1-test1-debug-api-35
          path: build/verified-apk
      - name: Publish verified APK and maintained release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_REF: ${{ github.ref }}
          BUILD_TAG: ${{ github.ref_name }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c "import re;print(re.search(r\"versionName\\s+'([^']+)'\",open('app/build.gradle').read()).group(1))")
          apk="Race-Day-Dreams-$version.apk"
          cp build/verified-apk/*.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          if [ "$BUILD_REF" = 'refs/heads/main' ]; then
            # An older successful workflow must not overwrite a newer main build.
            live=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
            if [ "$live" != "$BUILD_SHA" ]; then exit 0; fi
            python3 scripts/release-notes.py --commit "$BUILD_SHA" --run-url "$BUILD_URL" --development --output build/release-notes.md
            if gh api "repos/$GH_REPO/git/ref/tags/development" >/dev/null 2>&1; then
              gh api --method PATCH "repos/$GH_REPO/git/refs/tags/development" -f sha="$BUILD_SHA" -F force=true
            else
              gh api --method POST "repos/$GH_REPO/git/refs" -f ref='refs/tags/development' -f sha="$BUILD_SHA"
            fi
            if gh release view development >/dev/null 2>&1; then
              gh release edit development --title 'Latest Development Build' --notes-file build/release-notes.md --prerelease --latest=false
              gh release upload development "$apk" "$apk.sha256" --clobber
            else
              gh release create development "$apk" "$apk.sha256" --verify-tag --title 'Latest Development Build' --notes-file build/release-notes.md --prerelease --latest=false
            fi
            # Keep one rolling development release; leave immutable version releases alone.
            gh api "repos/$GH_REPO/releases/tags/development" --jq ".assets[] | select(.name != \"$apk\" and .name != \"$apk.sha256\") | .id" | while read -r asset; do
              gh api --method DELETE "repos/$GH_REPO/releases/assets/$asset"
            done
          else
            python3 scripts/release-notes.py --commit "$BUILD_SHA" --run-url "$BUILD_URL" --tag "$BUILD_TAG" --output build/release-notes.md
            # Permanent tags/releases are never overwritten, including accidental retries.
            if gh release view "$BUILD_TAG" >/dev/null 2>&1; then
              echo 'Version release already exists; refusing to overwrite it.' >&2
              exit 1
            fi
            gh release create "$BUILD_TAG" "$apk" "$apk.sha256" --verify-tag --title "Race Day Dreams $version" --notes-file build/release-notes.md --prerelease --latest=false
          fi
