name: Experimental shared Android and iOS migration
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kmp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-shared:
    if: github.head_ref == 'experiment/android-ios-kmp-compose' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Shared JVM and retained domain regression suites
        run: ./gradlew :sharedDomain:jvmTest :sharedHealth:jvmTest :domain:domainTest :domain:prepareOfflineTests
      - name: Existing schema and backup-format protections
        run: python3 scripts/test-schema.py
      - name: Compile the existing Android app and instrumentation APK
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise the migrated real theme, cards and disclosures
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        env:
          RDD_FOCUSED_CLASSES: org.racedaydreams.coach.MaterialThemeTest,org.racedaydreams.coach.PlainEnglishUiTest,org.racedaydreams.coach.StrengthAnalyticsScreenTest,org.racedaydreams.health.HealthConnectGatewayTest,org.racedaydreams.data.BodyMeasurementsRepositoryTest,org.racedaydreams.coach.BodyMeasurementsScreenTest,org.racedaydreams.coach.GymNowScreenTest,org.racedaydreams.data.GymToolsRepositoryTest,org.racedaydreams.coach.CoachOnboardingTest,org.racedaydreams.coach.CoachingInteractionTest,org.racedaydreams.coach.CoachCompletionStateTest,org.racedaydreams.data.SqliteUserPreferencesRepositoryTest,org.racedaydreams.data.CoachingStoreTest,org.racedaydreams.data.FeatureStoreTest,org.racedaydreams.data.ScopedRepositoriesTest,org.racedaydreams.coach.RunSummaryPresentationTest,org.racedaydreams.coach.ActivityHistoryReadinessTest,org.racedaydreams.coach.SharedShoeHistoryCardTest,org.racedaydreams.coach.ProgrammeProgressionClarityTest
        with:
          emulator-build: 16740729
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim
          profile: pixel_2
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          script: sh scripts/run-android-gate.sh
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-kmp-android-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-jvm-test-results
          path: |
            sharedDomain/build/test-results/
            sharedHealth/build/test-results/

  apple-shared:
    if: github.head_ref == 'experiment/android-ios-kmp-compose' || github.event_name == 'workflow_dispatch'
    # macos-latest arm64 has sustained capacity queues; keep real Apple tests on the Intel pool.
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Inspect actual Apple toolchain and simulator availability
        run: |
          xcodebuild -version
          xcrun simctl list devices available
      - name: Compile and test the real shared code for this simulator architecture
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(uname -m)" = arm64 ]; then
            ./gradlew :sharedDomain:iosSimulatorArm64Test :sharedHealth:iosSimulatorArm64Test :sharedUi:linkDebugFrameworkIosSimulatorArm64
          else
            ./gradlew :sharedDomain:iosX64Test :sharedHealth:iosX64Test :sharedUi:linkDebugFrameworkIosX64
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-shared-ios-framework
          path: sharedUi/build/bin/ios*/debugFramework/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-apple-test-results
          path: |
            sharedDomain/build/test-results/
            sharedHealth/build/test-results/
