name: Experimental shared Android and iOS migration
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kmp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-shared:
    if: github.head_ref == 'experiment/android-ios-kmp-compose' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Shared JVM and retained domain regression suites
        run: ./gradlew :sharedDomain:jvmTest :sharedHealth:jvmTest :sharedStorage:compileCommonMainKotlinMetadata :sharedStorage:jvmTest :domain:domainTest :domain:prepareOfflineTests
      - name: Existing schema and backup-format protections
        run: |
          python3 scripts/test-schema.py
          python3 scripts/shared-schema.py --check
          python3 scripts/test-screenshot-source.py
      - name: Compile the existing Android app and instrumentation APK
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise migrated UI, health and durable workout flows
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        env:
          RDD_FOCUSED_CLASSES: org.racedaydreams.data.SharedBackupEnvelopeTest,org.racedaydreams.data.SharedDetailRetentionArchiveTest,org.racedaydreams.data.SharedLegacyFingerprintTest,org.racedaydreams.data.SharedGymExecutionCommandsTest,org.racedaydreams.data.SharedGymAssociationCommandsTest,org.racedaydreams.data.SharedGymExecutionRecordsTest,org.racedaydreams.data.SharedStrengthProgrammingCommandsTest,org.racedaydreams.data.SharedFrozenWorkoutRecordTest,org.racedaydreams.data.SharedStrengthDraftCommandsTest,org.racedaydreams.data.SharedProgrammingArchiveTest,org.racedaydreams.data.SharedGymToolsTest,org.racedaydreams.data.SharedConcreteDraftCodecTest,org.racedaydreams.data.SharedLegacyGymProgrammeTest,org.racedaydreams.data.SharedGymAssociationCodecTest,org.racedaydreams.data.SharedStrengthProgrammingCodecTest,org.racedaydreams.data.SharedGymExecutionCodecTest,org.racedaydreams.data.SharedFrozenGymWorkoutCodecTest,org.racedaydreams.data.SharedStrengthChoicesTest,org.racedaydreams.data.SharedStrengthEvidenceCodecTest,org.racedaydreams.data.SharedRunningCoachingTest,org.racedaydreams.data.SharedActivityRepositoryTest,org.racedaydreams.data.SharedActivityCodecTest,org.racedaydreams.data.SharedShoeCodecTest,org.racedaydreams.coach.DreamBasemapAssetTest,org.racedaydreams.coach.DreamArtworkReadinessTest,org.racedaydreams.coach.DreamArtworkPublicationTest,org.racedaydreams.coach.DreamRoutePresentationTest,org.racedaydreams.reminders.EveningRemindersTest,org.racedaydreams.coach.TrainingRecoveryScreenTest,org.racedaydreams.coach.StorageManagementScreenTest,org.racedaydreams.data.DetailRetentionRepositoryTest,org.racedaydreams.coach.SharedMilestoneContentTest,org.racedaydreams.coach.AchievementsScreenTest,org.racedaydreams.data.AchievementsRepositoryTest,org.racedaydreams.coach.Release08UiTest,org.racedaydreams.data.Release08StoreTest,org.racedaydreams.coach.MaterialThemeTest,org.racedaydreams.coach.PlainEnglishUiTest,org.racedaydreams.coach.StrengthAnalyticsScreenTest,org.racedaydreams.health.HealthConnectGatewayTest,org.racedaydreams.data.BodyMeasurementsRepositoryTest,org.racedaydreams.coach.BodyMeasurementsScreenTest,org.racedaydreams.coach.GymNowScreenTest,org.racedaydreams.data.GymToolsRepositoryTest,org.racedaydreams.coach.CoachOnboardingTest,org.racedaydreams.coach.CoachingInteractionTest,org.racedaydreams.coach.CoachCompletionStateTest,org.racedaydreams.data.SqliteUserPreferencesRepositoryTest,org.racedaydreams.data.CoachingStoreTest,org.racedaydreams.data.AndroidSqlConnectionTest,org.racedaydreams.data.SharedCoachingContextTest,org.racedaydreams.data.FeatureStoreTest,org.racedaydreams.data.ScopedRepositoriesTest,org.racedaydreams.coach.RunSummaryPresentationTest,org.racedaydreams.coach.ActivityHistoryReadinessTest,org.racedaydreams.coach.SharedShoeHistoryCardTest,org.racedaydreams.coach.ProgrammeProgressionClarityTest,org.racedaydreams.coach.StrengthProgrammeBuilderScreenTest,org.racedaydreams.coach.CustomStrengthExerciseScreenTest,org.racedaydreams.data.StrengthProgrammingRepositoryTest,org.racedaydreams.data.StrengthProgrammingJsonTest,org.racedaydreams.data.ExerciseExclusionRepositoryTest,org.racedaydreams.coach.StrengthRecordsScreenTest,org.racedaydreams.coach.WeeklyUxTest,org.racedaydreams.data.GymExecutionRepositoryTest,org.racedaydreams.data.GymExecutionJsonTest,org.racedaydreams.data.GymExecutionBackupTest,org.racedaydreams.data.GymWorkoutCoordinatorAndroidTest,org.racedaydreams.data.GymExecutionAndroidTest,org.racedaydreams.data.GymWorkoutSourceAndroidTest,org.racedaydreams.coach.GymSubstitutionScreenTest,org.racedaydreams.coach.AuthoredGymNowScreenTest,org.racedaydreams.data.GymAssociationRepositoryTest,org.racedaydreams.data.AuthoredGymAssociationRepositoryTest,org.racedaydreams.data.GymAssociationJsonTest,org.racedaydreams.coach.GymAssociationScreenTest,org.racedaydreams.coach.AuthoredGymAssociationScreenTest,org.racedaydreams.coach.StrengthGenerationScreenTest,org.racedaydreams.data.ConcreteStrengthProgrammeDraftRepositoryTest,org.racedaydreams.coach.GuidanceArtworkTest,org.racedaydreams.coach.SharedTechniqueContentTest,org.racedaydreams.coach.SharedRunningRoutineScreenTest,org.racedaydreams.coach.ActiveRunPanelTest,org.racedaydreams.coach.LiveRunningRefinementTest,org.racedaydreams.coach.SharedActiveRunPanelTest,org.racedaydreams.coach.SharedRunComparisonTest,org.racedaydreams.coach.SharedRunDurabilityCardTest,org.racedaydreams.coach.SharedBaselineSummaryCardTest,org.racedaydreams.coach.SharedRunFeedbackCardTest,org.racedaydreams.coach.SharedWeeklyReviewContentTest,org.racedaydreams.coach.SharedHomeAndStrengthTodayTest,org.racedaydreams.coach.SharedHealthContextTest,org.racedaydreams.coach.SharedCoachShellTest,org.racedaydreams.coach.SharedCoachStateBindingsTest,org.racedaydreams.coach.CoachSnapshotReaderTest,org.racedaydreams.coach.SharedProfileOperationsTest,org.racedaydreams.coach.ExerciseBrowseScreenTest,org.racedaydreams.coach.SharedExerciseBrowseScreenTest,org.racedaydreams.coach.CoachOperationRunnerTest,org.racedaydreams.coach.FeatureNavigationTest,org.racedaydreams.recording.RecordingSessionCoordinatorTest,org.racedaydreams.recording.RecordingSensorCoordinatorTest,org.racedaydreams.data.RunRecordingStoreTest,org.racedaydreams.data.RecordingCoordinationStoreTest,org.racedaydreams.data.LiveCoachStoreTest
        with:
          emulator-build: 16740729
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim
          profile: pixel_2
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          script: sh scripts/run-android-gate.sh
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-kmp-android-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-jvm-test-results
          path: |
            sharedDomain/build/test-results/
            sharedHealth/build/test-results/
            sharedStorage/build/test-results/

  apple-shared:
    if: github.head_ref == 'experiment/android-ios-kmp-compose' || github.event_name == 'workflow_dispatch'
    # macos-latest arm64 has sustained capacity queues; keep real Apple tests on the Intel pool.
    runs-on: macos-26-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Inspect actual Apple toolchain and simulator availability
        run: |
          xcodebuild -version
          xcrun simctl list devices available
      # Keep Native tests and Compose framework code generation separately observable and
      # avoid overlapping heavy Native work on cold runners; no test is omitted.
      - name: Compile and test the real shared code for this simulator architecture
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(uname -m)" = arm64 ]; then
            ./gradlew --max-workers=2 --no-parallel --info :sharedDomain:iosSimulatorArm64Test :sharedHealth:iosSimulatorArm64Test :sharedStorage:iosSimulatorArm64Test
          else
            ./gradlew --max-workers=2 --no-parallel --info :sharedDomain:iosX64Test :sharedHealth:iosX64Test :sharedStorage:iosX64Test
          fi
      # Preserve completed XML evidence before starting the separately observable framework stage.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-apple-test-results
          path: |
            sharedDomain/build/test-results/
            sharedHealth/build/test-results/
            sharedStorage/build/test-results/
      - name: Link the real shared Compose framework after Native tests pass
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(uname -m)" = arm64 ]; then
            ./gradlew --max-workers=2 --no-parallel --info :sharedUi:linkDebugFrameworkIosSimulatorArm64
          else
            ./gradlew --max-workers=2 --no-parallel --info :sharedUi:linkDebugFrameworkIosX64
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-shared-ios-framework
          path: sharedUi/build/bin/ios*/debugFramework/
          if-no-files-found: error
