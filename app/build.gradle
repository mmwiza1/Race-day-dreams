plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'org.racedaydreams'
    compileSdk 36

    defaultConfig {
        applicationId 'org.racedaydreams'
        minSdk 28
        targetSdk 35
        versionCode 25
        versionName '0.15.2-test1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        // Public fingerprint of the project's release signing certificate (never a key). Builds
        // whose own certificate matches it may check for and install in-place updates; all other
        // builds, including CI test builds, never contact the network on their own.
        manifestPlaceholders = [rddReleaseCertificate: rddReleaseCertificate()]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true }

    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'

    lint {
        abortOnError true
        warningsAsErrors false
    }
}

/**
 * The committed release certificate fingerprint (`config/android-signing-certificate.sha256`), or an
 * empty string until the owner configures stable signing. `-PrddReleaseCertificate=` overrides it
 * only for the upgrade-path test, which signs with a throwaway test key.
 */
def rddReleaseCertificate() {
    def override = project.findProperty('rddReleaseCertificate')
    def pinFile = rootProject.file('config/android-signing-certificate.sha256')
    def value = override != null ? override.toString() : (pinFile.exists() ? pinFile.text : '')
    value = value.trim().toLowerCase()
    if (!value.isEmpty() && !(value ==~ /[0-9a-f]{64}/))
        throw new GradleException('config/android-signing-certificate.sha256 must hold one SHA-256 hex digest')
    return value
}

// The upgrade-path test installs two builds of this source with increasing version codes and
// a throwaway test key. Publication always uses the literal versionCode above.
if (project.hasProperty('rddUpgradeTestVersionCode'))
    android.defaultConfig.versionCode = project.property('rddUpgradeTestVersionCode') as int
if (System.getenv('RDD_UPGRADE_TEST_KEYSTORE')) {
    android.signingConfigs {
        upgradeTest {
            storeFile file(System.getenv('RDD_UPGRADE_TEST_KEYSTORE'))
            storePassword System.getenv('RDD_UPGRADE_TEST_PASSWORD')
            keyAlias 'upgrade-test'
            keyPassword System.getenv('RDD_UPGRADE_TEST_PASSWORD')
        }
    }
    android.buildTypes.debug.signingConfig = android.signingConfigs.upgradeTest
}

dependencies {
    implementation project(':domain')
    implementation project(':sharedUi')
    implementation platform('androidx.compose:compose-bom:2025.07.00')
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.navigation:navigation-compose:2.8.5'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'androidx.health.connect:connect-client:1.1.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    androidTestImplementation platform('androidx.compose:compose-bom:2025.07.00')
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
}
